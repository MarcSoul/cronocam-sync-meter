name: Build Cronocam Sync Meter
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/delay.cpp -o /tmp/audio-sync-test
      - run: /tmp/audio-sync-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/pcm_delay.cpp -o /tmp/audio-pcm-delay-test
      - run: /tmp/audio-pcm-delay-test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-x64
          - os: macos-15-intel
            preset: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: master
          path: .obs-template
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.30.5'
      - name: Prepare source tree
        shell: bash
        run: |
          version=0.2.1
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          python3 packaging/prepare-template.py .obs-template "$version"
      - name: Build plugin
        working-directory: .obs-template
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --config Release
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem .obs-template/build_x64 -Recurse -Filter cronocam-sync-meter.dll |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $dll) { throw "Plugin DLL not found" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DPluginDll=$($dll.FullName)" "/DPluginVersion=$env:PLUGIN_VERSION" "/O$pwd\dist" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package macOS universal plugin
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plugin="$(find .obs-template/build_macos -type d -name 'cronocam-sync-meter.plugin' -path '*/Release/*' -print -quit)"
          test -n "$plugin"
          lipo "$plugin/Contents/MacOS/cronocam-sync-meter" -verify_arch arm64 x86_64
          mkdir -p dist
          ditto -c -k --keepParent "$plugin" "dist/cronocam-sync-meter-$PLUGIN_VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cronocam-sync-meter-${{ matrix.preset }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Cronocam Sync Meter v0.2.1')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cronocam-sync-meter-*
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
            gh release create v0.2.1 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Cronocam Sync Meter v0.2.1" \
              --notes "Mejora la detección de desfase entre micrófonos distintos al comparar también los ataques sonoros. Mantiene la comprobación de ambigüedad antes de sugerir una corrección."
            exit
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Cronocam Sync Meter $GITHUB_REF_NAME" --generate-notes
